services:
  webapps:
    image: webapps
    container_name: webapps
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - webapps-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: webapps_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: webapps
      MYSQL_USER: webapps
      MYSQL_PASSWORD: webapps
      MYSQL_ROOT_PASSWORD: webapps
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - webapps-network

  selenium:
    image: selenium/standalone-chrome
    container_name: webapps_selenium
    ports:
      - "7900:7900" # VNC (pra ver o browser rodando)
    networks:
      - webapps-network
    shm_size: 2gb

  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: webapps_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      webapps-network:
        aliases:
          - auth.local

networks:
  webapps-network:

volumes:
  mariadb_data: